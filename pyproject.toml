[project]
name = "mimic-client"
version = "0.1.0"
description = "Capture app traffic and reconstruct authorized web apps locally with Ollama."
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Divy Srivastava", email = "me@littledivy.com" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
capture = ["mitmproxy>=10"]

[project.scripts]
mimic = "mimic.cli:main"
mimic-build = "mimic.build_cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mimic*"]
