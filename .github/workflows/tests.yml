name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[capture,analysis]" pytest
      - run: python -m compileall -q mimic
      - run: mimic-analyze --help
      - run: mimic-trace --help
      - run: python -m pytest -q
